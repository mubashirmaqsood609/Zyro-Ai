
name: Build ZYRO AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(command -v sdkmanager || true)

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK Manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract ZYRO AI source
        run: |
          mkdir -p source

          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP file not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d source

          SETTINGS_FILE=$(find source \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found at: $PROJECT_DIR"

      - name: Build ZYRO AI APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Find generated APK
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk"

      - name: Upload ZYRO AI APK
        uses: actions/upload-artifact@v4
        with:
          name: ZYRO-AI-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
